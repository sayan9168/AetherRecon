[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aetherrecon"
version = "1.0.0"
description = "Advanced Modular Grey-Hat Research Framework for authorized security research"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Sayan the researcher", email = "sm6881164@gmail.com"}
]
requires-python = ">=3.10"
keywords = ["security", "osint", "forensics", "recon", "research", "ethical"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "loguru>=0.7.2",
    "httpx>=0.27.0",
    "dnspython>=2.4.0",
    "psutil>=5.9.0",
    "cryptography>=42.0.0",
    "pillow>=10.2.0",
    "numpy>=1.26.0",
    "beautifulsoup4>=4.12.0",
    "jinja2>=3.1.0",
    "streamlit>=1.31.0",
]

[project.optional-dependencies]
full = [
    "scapy>=2.5.0",
    "python-nmap>=0.7.1",
    "netifaces>=0.11.0",
    "whois>=0.9.27",
    "reportlab>=4.1.0",
    "pandas>=2.1.0",
    "matplotlib>=3.8.0",
    "networkx>=3.2.0",
    "textual>=0.47.0",
    "stegano>=0.11.2",
]

[project.scripts]
aetherrecon = "aetherrecon.__main__:app"

[project.urls]
Homepage = "https://github.com/sayan9168/AetherRecon"
Repository = "https://github.com/sayan9168/AetherRecon"

[tool.setuptools.packages.find]
where = ["."]
include = ["aetherrecon*", "core*", "modules*", "gui*", "utils*", "plugins*"]
